services:
  postgres:
    image: postgres:16-alpine
    container_name: debating-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: debating
    ports:
      - "5432:5432"
    volumes:
      - debating_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d debating"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  debating_pg_data:
